name: ci

# 只读权限：PR（含 fork）跑的是仓库自己的代码，不需要写权限；本项目也从不使用仓库 secret
permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    # 单独放 Linux 且做「逐级精确名字比对」：Windows 文件系统大小写不敏感，
    # docs/config.md 这种错链在本地 Test-Path 会通过、到 GitHub 却是 404。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 文档相对链接检查（大小写敏感）
        run: |
          python3 - <<'PY'
          import os, re, sys, urllib.parse

          def resolve(base, rel):
              cur = base
              for part in rel.split('/'):
                  if part in ('', '.'):
                      continue
                  if part == '..':
                      cur = os.path.dirname(cur)
                      continue
                  if not os.path.isdir(cur) or part not in os.listdir(cur):
                      return None
                  cur = os.path.join(cur, part)
              return cur

          files, bad = [], []
          for root, dirs, names in os.walk('.'):
              dirs[:] = [d for d in dirs if d != '.git']
              files += [os.path.join(root, n) for n in names
                        if n.endswith(('.md', '.yml', '.yaml'))]

          for f in files:
              text = open(f, encoding='utf-8').read()
              for m in re.finditer(r'\]\(([^)\s]+)', text):
                  link = m.group(1)
                  if re.match(r'^(https?:|mailto:|#)', link):
                      continue
                  path = urllib.parse.unquote(link.split('#')[0])
                  if path and resolve(os.path.dirname(f) or '.', path) is None:
                      bad.append(f'{f} -> {link}')

          if bad:
              print('BROKEN 相对链接：')
              print('\n'.join(bad))
              sys.exit(1)
          print(f'OK：{len(files)} 个文件，0 条失效相对链接')
          PY

  windows:
    # 本项目只支持 Windows，跑的是门控本体与回归
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 语法检查
        shell: pwsh
        run: |
          Get-ChildItem gate\*.mjs, probe\*.mjs, bin\*.mjs | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: 版本一致性（README 顶部 ↔ package.json）
        shell: pwsh
        run: |
          # 起因：v0.1.1 发布后发现 README 顶部与下载链接仍写着 v0.1.0，用户会照旧版去下载。
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $m = Select-String -Path README.md -Pattern '`v(\d+\.\d+\.\d+)`' | Select-Object -First 1
          if (-not $m) { Write-Error 'README 顶部找不到 `vX.Y.Z` 版本标记'; exit 1 }
          $rv = $m.Matches[0].Groups[1].Value
          if ($rv -ne $pkg) { Write-Error "版本不一致：README=v$rv package.json=$pkg"; exit 1 }
          $zip = "opencode-ds-route-v$pkg.zip"
          if (-not (Select-String -Path README.md -SimpleMatch $zip -Quiet)) { Write-Error "README 未引用当前发布包名 $zip"; exit 1 }
          Write-Host "OK：v$pkg（README 与 package.json 一致，且引用了 $zip）"
      - name: 脚本编码检查（PS 5.1 兼容：.ps1/.vbs 含非 ASCII 必须有 BOM，行尾必须 CRLF）
        shell: pwsh
        run: |
          # 背景：PowerShell 5.1 对无 BOM 的 .ps1 会按 GBK 解码，中文注释会吞掉后面的引号导致解析失败。
          # .gitignore 管不到这个 —— 编辑器/脚本改写吃掉 BOM 时，只有断言能拦住。
          # .cmd 例外：BOM 会让 cmd.exe 把首行当成命令执行，所以只要求 CRLF，不要求 BOM。
          $bad = @()
          foreach ($f in Get-ChildItem -Recurse -File -Include *.ps1, *.vbs, *.cmd) {
            $b = [IO.File]::ReadAllBytes($f.FullName)
            $hasBom = $b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF
            $text = [IO.File]::ReadAllText($f.FullName)
            $nonAscii = [regex]::IsMatch($text, '[^\x00-\x7F]')
            $bareLf = [regex]::Matches($text, "(?<!`r)`n").Count
            $needsBom = $f.Extension -in '.ps1', '.vbs'
            if ($needsBom -and $nonAscii -and -not $hasBom) { $bad += "$($f.Name): 含非 ASCII 但缺 UTF-8 BOM" }
            if ($bareLf -gt 0) { $bad += "$($f.Name): 有 $bareLf 处裸 LF（应为 CRLF）" }
          }
          if ($bad) { $bad | ForEach-Object { Write-Host "FAIL $_" }; exit 1 }
          Write-Host 'OK：脚本编码与行尾安全'

      - name: 源码自检（312 条断言，离线）
        run: node gate/verify-patch.mjs

      - name: 自包含回归（66 条，自带 mock 上游，不需要 key）
        run: node gate/test-coverage.mjs

      - name: 冒烟：起服务并读 health
        shell: pwsh
        run: |
          $env:OPENCODE_GO_API_KEY = 'dummy-for-smoke'
          $env:GATE_HOST = '127.0.0.1'
          $env:GATE_HOST_PORT = '1'
          $env:GATE_HOST_SCHEME = 'http'
          $env:GATE_PORT = '8790'
          $env:GATE_REFRESH_MS = '0'
          $proc = Start-Process node -ArgumentList 'bin/ocg.mjs','start' -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 20; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $h = Invoke-RestMethod 'http://127.0.0.1:8790/gate/health' -TimeoutSec 2
                if ($h.ok) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { Write-Error 'health 未就绪'; exit 1 }
            Write-Host "health ok, egress=$($h.egressHost)"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: 审计自检（依赖必须为 0）
        shell: pwsh
        run: |
          # 必须先 Out-String：$out 是数组，数组 -notmatch 会做"过滤"而不是"整体匹配"，
          # 即使每行都不匹配也会返回非空数组 → 恒真 → 误报（首次 CI 就是这么红的）。
          $out = (node bin/ocg.mjs audit) | Out-String
          Write-Host $out
          if ($out -notmatch '第三方依赖\s+0 个') { Write-Error '发现第三方依赖'; exit 1 }
